[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-posture-management"
version = "0.1.0"
description = "Scan cloud accounts for misconfigurations against CIS benchmark controls and report findings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["cspm", "cloud-security", "cis-benchmark", "aws", "compliance", "sarif"]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]

[project.scripts]
cspm = "cspm.cli:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/cloud-security-posture-management"
Issues = "https://github.com/abhisheksawant52/cloud-security-posture-management/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
